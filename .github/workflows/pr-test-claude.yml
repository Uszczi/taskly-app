name: PR test agent (Claude Code)

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-test-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: CI
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Prepare directories
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install the CI tools
        run: |
          uv export --project claude-ci --frozen --no-dev --no-emit-project --no-hashes \
            > "$RUNNER_TEMP/ci-pins.txt"
          uv tool install ./claude-ci --constraints "$RUNNER_TEMP/ci-pins.txt"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          taskly-claude-ci --out "$OUT_DIR" prompt --base "$BASE_SHA" \
            --schema .github/claude-test-agent/report.schema.json >> "$GITHUB_OUTPUT"

      - name: Install bubblewrap
        if: steps.plan.outputs.has_targets == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.has_targets == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.plan.outputs.has_targets == 'true'
        run: |
          uv venv backend/.venv --python 3.12
          uv pip install --python backend/.venv -r backend/requirements.txt
          npm ci --prefix frontend
          # .claude/skills holds the developers' skills; Claude in CI gets the shared testing skills.
          rm -rf .claude/skills
          mkdir -p .claude/skills
          cp -r .github/claude-test-agent/skills/. .claude/skills/
          cp -r .github/claude-test-agent/agents .claude/agents

      - name: Coverage before
        if: steps.plan.outputs.has_targets == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: taskly-claude-ci --out "$OUT_DIR" coverage before --base "$BASE_SHA"

      - name: Run Claude Code
        id: claude
        if: steps.plan.outputs.has_targets == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          settings: .github/claude-test-agent/settings.json
          prompt: ${{ steps.plan.outputs.prompt }}
          claude_args: >-
            --agent unit-test-writer
            --model ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
            --max-turns 200
            --json-schema '${{ steps.plan.outputs.schema }}'

      - name: Verify
        id: verify
        if: always() && steps.plan.outputs.has_targets == 'true'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          REPORT: ${{ steps.claude.outputs.structured_output }}
        run: |
          rm -rf .claude/skills .claude/agents && git checkout -q -- .claude

          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --binary > "$OUT_DIR/tests.patch"
          fi
          taskly-claude-ci --out "$OUT_DIR" verify --conclusion "$CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Coverage after
        if: always() && steps.plan.outputs.has_targets == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: taskly-claude-ci --out "$OUT_DIR" coverage after --base "$BASE_SHA"

      - name: Build PR comment
        if: always() && steps.plan.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          taskly-claude-ci --out "$OUT_DIR" comment --run-url "$RUN_URL" --model "$MODEL" \
            --execution-file "$EXECUTION_FILE"
          cat "$OUT_DIR/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outcome == 'success'
        with:
          name: test-agent-claude
          path: ${{ runner.temp }}/out/
          retention-days: 14

      - name: Fail when Claude or its tests failed
        if: steps.verify.outputs.status != '' && steps.verify.outputs.status != 'ok'
        env:
          STATUS: ${{ steps.verify.outputs.status }}
        run: |
          echo "::error::Claude Code test run: $STATUS"
          exit 1

  publish:
    needs: generate
    if: always() && needs.generate.result != 'skipped' && needs.generate.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OUT_DIR: ${{ github.workspace }}/out # hashFiles() below takes it relative: 'out/...'
    permissions:
      contents: write
      pull-requests: write # open the tests PR, comment on the PR
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # missing when generate failed early
        with:
          name: test-agent-claude
          path: ${{ env.OUT_DIR }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.generate.outputs.status == 'ok' && hashFiles('out/tests.patch') != ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo

      - name: Open the tests PR
        if: needs.generate.outputs.status == 'ok' && hashFiles('out/tests.patch') != ''
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha=${HEAD_SHA:0:7}
          branch="test-agent/pr-$PR-$sha"
          git switch -q -c "$branch"
          git apply --index "$OUT_DIR/tests.patch"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "test: add unit tests for #$PR ($sha)"
          git push -q origin "$branch"
          url=$(gh pr create --base "$HEAD_REF" --head "$branch" \
            --title "test: unit tests for #$PR ($sha)" --body-file "$OUT_DIR/comment.md")
          # The full report is in the tests PR; this PR gets a link to it.
          echo "🧪 Tests for $sha, with their results and coverage: $url" > "$OUT_DIR/link.md"

      - name: Post the PR comment
        if: hashFiles('out/comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$OUT_DIR/comment.md"
          if [ -f "$OUT_DIR/link.md" ]; then body="$OUT_DIR/link.md"; fi
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
