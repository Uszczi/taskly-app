# claude-ci's own unit tests (no model, no network).
name: Test claude-ci

on:
  push:
    branches: [main]
    paths: [claude-ci/**, .github/claude-test-agent/**, .github/workflows/test-claude-ci.yml]
  pull_request:
    paths: [claude-ci/**, .github/claude-test-agent/**, .github/workflows/test-claude-ci.yml]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: claude-ci
        run: uv run --frozen pytest
