[project]
name = "taskly-test-agent"
version = "0.1.0"
description = "Provider-agnostic agent that writes and runs unit tests for Taskly"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic,google,openai]>=2.59.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
taskly-test-agent = "taskly_test_agent:main"
taskly-pr-comment = "taskly_test_agent.pr_comment:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
